/* TOMBOL HEN */
.hen-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    height: 90px;

    color: white;
    text-decoration: none;

    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;

    backdrop-filter: blur(8px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.5);

    transition: 0.2s;
}

.hen-button:hover {
    transform: scale(1.04);
    background: rgba(255,255,255,0.25);
}

/* INFO */
.info {
    margin-top: 30px;

    font-size: 20px;
    line-height: 1.7;

    text-shadow: 0 3px 8px black;
}

/* WHATSAPP */

    text-shadow: 0 3px 8px black;
}

/* FOOTER */

    bottom: 25px;

    width: 100%;
    text-align: center;

    font-size: 17px;
    color: rgba(255,255,255,0.85);
